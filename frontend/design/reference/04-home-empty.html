<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, empty, grey</title>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>



<style>
/* Fonts: Geist, Geist Mono, Noto Naskh Arabic (Google Fonts) */
body{margin:0}
a{color:#2340C8}a:hover{color:#182E96}
.crease{position:absolute;inset:0;background:url(../assets/crease.jpg) center/300px auto repeat;mix-blend-mode:overlay;pointer-events:none;z-index:20}
.tear{-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 6px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 6px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 6px repeat-x}
.m{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
.cap{font:500 10.5px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#4A4944}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 60px 84px;min-height:42px}
.tr>*{display:flex;align-items:center}
.tr>*+*{border-left:1px solid rgba(0,0,0,.13);justify-content:flex-end;padding-right:6px}
.tr>*:first-child{padding-right:14px}
.blank{display:block;height:0;border-bottom:1.5px dashed rgba(0,0,0,.25);width:100%}
.perf{height:10px;background:radial-gradient(circle,#C9CBCF 2.5px,transparent 3px) center/12px 10px repeat-x}
</style>

<div style="width:390px;height:844px;box-sizing:border-box;background:#E3E4E6;color:#1A1A1A;font-family:Geist,sans-serif;display:flex;flex-direction:column;overflow:hidden">

  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 12px 4px 20px">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-weight:600;font-size:18px;letter-spacing:-.01em">Fatourati</span>
      <span lang="ar" style="font:600 15px 'Noto Naskh Arabic',serif;color:#55544F">فاتورتي</span>
    </div>
    <button aria-label="Notifications" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#1A1A1A;display:grid;place-items:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
    </button>
  </div>

  <div style="margin:14px 14px 0;filter:drop-shadow(0 10px 14px rgba(40,35,25,.14)) drop-shadow(0 1px 1px rgba(40,35,25,.1))">
    <div class="tear" style="position:relative;isolation:isolate;background:#EFEEEB;padding:16px 18px 22px">
      <div style="display:flex;justify-content:space-between"><span class="cap" style="color:#2340C8">Invoice Nº 0001</span><span class="cap">Nov 2026</span></div>
      <div style="font-size:14px;color:#46453F;margin-top:12px">Billed to Christina</div>
      <div class="m" style="font-weight:500;font-size:52px;line-height:1.05;letter-spacing:-.04em;margin-top:2px;color:#86857F">$0.00</div>
      <div style="font-size:13px;color:#46453F;margin-top:4px">A blank invoice. It fills itself in as you scan.</div>

      <div style="margin-top:16px;border-top:1px solid #1A1A1A">
        <div class="tr" style="min-height:28px"><span class="cap">Budget</span><span class="cap">Limit</span><span class="cap">Spent</span></div>
        <div class="tr" style="border-top:1px solid rgba(0,0,0,.13)"><span><i class="blank" style="width:70%"></i></span><span><i class="blank"></i></span><span><i class="blank"></i></span></div>
        <div class="tr" style="border-top:1px solid rgba(0,0,0,.13)"><span><i class="blank" style="width:52%"></i></span><span><i class="blank"></i></span><span><i class="blank"></i></span></div>
        <div class="tr" style="border-top:1px solid rgba(0,0,0,.13)"><span><i class="blank" style="width:62%"></i></span><span><i class="blank"></i></span><span><i class="blank"></i></span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:3px double #1A1A1A;padding-top:9px;margin-top:2px">
          <span class="cap" style="color:#1A1A1A">Total</span><span class="m" style="font-size:17px;font-weight:600;color:#86857F">$0.00</span>
        </div>
      </div>

      <a href="#" style="margin-top:14px;display:flex;align-items:center;gap:10px;min-height:44px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.28);text-decoration:none;color:#1A1A1A">
        <span class="cap" style="color:#2340C8">Note</span>
        <span style="flex:1;font-size:14px;color:#3A3934">Set your first monthly budget</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2340C8" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <div class="crease" style="opacity:0.6"></div>
    </div>
  </div>

  <div style="margin:18px 20px 0">
    <span class="cap" style="color:#1A1A1A">Recent receipts</span>
    <div style="margin-top:10px;border:1.5px dashed #B3B5BA;border-radius:6px;padding:20px 18px;display:flex;align-items:center;gap:14px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#55544F" stroke-width="1.5" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>
      <div style="display:flex;flex-direction:column;gap:3px">
        <span style="font-weight:500;font-size:15px">No receipts yet</span>
        <span style="font-size:13px;color:#55544F">Tap Scan below to add your first one.</span>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;background:#F6F6F5">
    <div class="perf"></div>
    <nav style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:2px 6px 12px">
      <a href="#" style="min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#1A1A1A">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 11l8-6 8 6v8H4z"></path><path d="M10 19v-5h4v5"></path></svg>
        <span style="font-size:11.5px;font-weight:600">Home</span></a>
      <a href="#" style="min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#55544F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
        <span style="font-size:11.5px;font-weight:500">Receipts</span></a>
      <a href="#" aria-label="Scan a receipt" style="justify-self:center;width:56px;height:56px;border-radius:16px;background:#2340C8;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 5px rgba(35,64,200,.14)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"></path></svg></a>
      <a href="#" style="min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#55544F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"></path><path d="M12 18l4-5"></path></svg>
        <span style="font-size:11.5px;font-weight:500">Budgets</span></a>
      <a href="#" style="min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#55544F">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path><path d="M8 10h8"></path></svg>
        <span style="font-size:11.5px;font-weight:500">Assistant</span></a>
    </nav>
  </div>
</div>


</body>
</html>
